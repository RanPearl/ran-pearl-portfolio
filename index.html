<body>

  <!-- ═══════════════════════════════════
       BOOT SCREEN
  ═══════════════════════════════════ -->
  <div id="boot-screen" role="dialog" aria-label="RanOS 96 Boot Screen" aria-modal="true">
    <div class="boot-content">
      <div class="boot-logo">
        <div class="boot-logo-icon" aria-hidden="true">
          <svg width="80" height="80" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="6" width="44" height="30" rx="2" fill="#C0C0C0" stroke="#808080"/>
            <rect x="5" y="9" width="38" height="24" fill="#000080"/>
            <rect x="20" y="36" width="8" height="5" fill="#A0A0A0"/>
            <rect x="13" y="41" width="22" height="3" fill="#808080"/>
            <text x="24" y="25" text-anchor="middle" font-family="monospace" font-size="9" fill="#00FF41">RanOS</text>
            <text x="24" y="31" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">96</text>
          </svg>
        </div>
        <h1 class="boot-title">RanOS 96</h1>
        <p class="boot-subtitle">Personal Edition · Copyright © 2024 Ran Pearl</p>
      </div>
      <div class="boot-progress-wrap">
        <div class="boot-progress-container"
             role="progressbar"
             aria-valuemin="0"
             aria-valuemax="100"
             aria-valuenow="0"
             id="boot-progress-bar">
          <div class="boot-progress-fill" id="boot-progress-fill"></div>
        </div>
      </div>
      <p class="boot-status" id="boot-status" aria-live="polite">Starting RanOS 96…</p>
      <button class="boot-skip" id="boot-skip">Skip ▶</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════
       DESKTOP
  ═══════════════════════════════════ -->
  <div id="desktop" aria-label="RanOS 96 Desktop">

    <!-- Desktop Icons -->
    <main id="icon-grid" aria-label="Desktop icons" role="list"></main>

    <!-- Windows Container -->
    <div id="windows-container" aria-label="Application windows"></div>

    <!-- Cats -->
    <div id="cats-container" aria-hidden="true"></div>

    <!-- ─── TASKBAR ─── -->
    <footer id="taskbar" role="toolbar" aria-label="Taskbar">

      <!-- Start button -->
      <button class="start-btn"
              id="start-btn"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="start-menu">
        <svg width="16" height="16" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="2" y="6" width="44" height="30" rx="2" fill="#C0C0C0" stroke="#808080"/>
          <rect x="5" y="9" width="38" height="24" fill="#000080"/>
          <rect x="20" y="36" width="8" height="5" fill="#A0A0A0"/>
          <rect x="13" y="41" width="22" height="3" fill="#808080"/>
        </svg>
        <span>Start</span>
      </button>

      <!-- Start Menu (shown above taskbar) -->
      <nav id="start-menu"
           role="menu"
           aria-label="Start Menu"
           hidden></nav>

      <!-- Separator -->
      <div class="taskbar-sep" aria-hidden="true"></div>

      <!-- Open windows list -->
      <div id="taskbar-windows" role="list" aria-label="Open windows" class="taskbar-windows"></div>

      <!-- Right cluster: mute + clock -->
      <div class="taskbar-right">
        <button id="mute-btn"
                class="taskbar-tray-btn"
                aria-label="Sound muted — click to unmute"
                aria-pressed="true"
                title="Toggle sound">🔇</button>
        <div class="taskbar-clock" id="taskbar-clock" role="timer" aria-label="Current time">
          <span id="clock-time">12:00 AM</span>
        </div>
      </div>

    </footer><!-- /taskbar -->
  </div><!-- /desktop -->
